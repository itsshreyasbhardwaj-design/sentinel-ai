name: Bug report
description: Something behaves differently from how it is documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **security vulnerability**, please do
        not use this form — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Run `pnpm scan ./example`
        2. Open the report
        3. …
    validations:
      required: true

  - type: textarea
    id: sample
    attributes:
      label: Minimal code sample
      description: >
        If this is about a detection, the smallest snippet that should (or should
        not) be flagged. Please redact anything sensitive.
      render: text

  - type: input
    id: version
    attributes:
      label: Sentinel version or commit
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit this?
      options:
        - CLI
        - Dashboard
        - REST API
        - CI integration
        - Library / package import
    validations:
      required: true

  - type: textarea
    id: health
    attributes:
      label: Health output
      description: >
        Output of `GET /api/health`, or `pnpm scan --list-scanners` for CLI
        issues. This tells us which components are actually wired up.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `LOG_LEVEL=debug` if you can. Redact secrets.
      render: shell
